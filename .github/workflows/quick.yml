# Quick verify (docs/change-sop.md), on every push to main, aiming for about 3 minutes:
# type-check, boundary check, build, every rule test, then the browser smoke set (tests tagged @smoke)
# and the browser tests for the areas changed since the last green quick run (tests/browser/areas.json), Android only.
# When a push touches shared set-up (__ALL__), every browser test runs instead, split in two parallel shards.
# Known-flaky tests (@quarantine) run every time in a separate step that never blocks; results on the run's summary page.
# Screenshot tests (@screens) never run here: they belong to the complete run (ci.yml) and screenshots.yml.
# Green: publishes the owner's preview link, https://virapandy.github.io/pocket-game-night/preview/.
# The families' link is left on the last release (the families' half is rebuilt from that commit).
# Pushes that change only docs/ or reports/ do not start a run.
# Lane branches (lane-*): the same checks, with area tests from everything the lane changed since origin/main; never publishes, and a newer push to the same lane cancels the older run.
name: Quick verify

on:
  push:
    branches: [main, 'lane-*']
    paths-ignore:
      - 'docs/**'
      - 'reports/**'

permissions:
  contents: read
  actions: read # to find the last green quick run (the area tests' diff base)

# main: queue, never cancel: a run that is nearly done is kept. GitHub keeps only the newest waiting run,
# but each run diffs from the last green quick run, so a skipped push's areas are still covered.
# lane-*: one group per lane; a newer push cancels the older run (each lane run covers the whole lane).
concurrency:
  group: quick-verify-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/lane-') }}

jobs:
  # Picks the area tests: spec files mapped from the paths changed since the last green quick run on main
  # (falling back to the push's own range), so a push whose run was skipped or failed is covered.
  # mode: none (smoke set only), areas (the listed specs), all (every browser test, in two shards).
  # No map, or no match: the smoke set alone. __ALL__ (an area mapped to "*", such as package.json): all.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.pick.outputs.mode }}
      specs: ${{ steps.pick.outputs.specs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changed files since the last green run pick the area tests
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pick the area tests
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          PUSH_BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ ! -f tests/playwright.config.ts ]; then echo "No browser tests."; echo "mode=none" >> "$GITHUB_OUTPUT"; exit 0; fi
          case "$REF_NAME" in
            lane-*)
              # A lane is checked as one change: everything it changed since it left origin/main.
              BEFORE=$(git merge-base origin/main "$AFTER" 2>/dev/null || true)
              if [ -z "$BEFORE" ]; then BEFORE="$PUSH_BEFORE"; echo "No merge base with origin/main; diff base: $BEFORE."
              else echo "Lane $REF_NAME; diff base: where it left origin/main, $BEFORE."; fi
              ;;
            *)
              BEFORE=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow quick.yml --branch main --status success \
                --limit 1 --json headSha --jq '.[0].headSha // empty' 2>/dev/null || true)
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null && git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
                echo "Diff base: last green quick run, $BEFORE."
              else
                BEFORE="$PUSH_BEFORE"
                echo "No usable green quick run found; diff base: this push's previous commit, $BEFORE."
              fi
              ;;
          esac
          specs=$(node scripts/browser-areas.mjs "$BEFORE" "$AFTER")
          if [ -z "$specs" ]; then
            echo "No area tests mapped for this push; smoke set only."
            echo "mode=none" >> "$GITHUB_OUTPUT"
          elif [ "$specs" = "__ALL__" ]; then
            echo "This push touches shared set-up: every browser test on Android, in two shards."
            echo "mode=all" >> "$GITHUB_OUTPUT"
          else
            echo "Area tests:"; echo "$specs"
            echo "mode=areas" >> "$GITHUB_OUTPUT"
            echo "specs=$(echo "$specs" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

  verify:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Boundary check
        run: npm run check:boundaries
      - name: Build
        run: npm run build
      - name: Rule, contract and property tests
        if: hashFiles('tests/vitest.config.ts') != ''
        run: npm test
      - name: Playwright version
        id: pw
        if: hashFiles('tests/playwright.config.ts') != ''
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: pw-cache
        if: hashFiles('tests/playwright.config.ts') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}
      - name: Install browser
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser system libraries
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser smoke set
        id: smoke
        if: hashFiles('tests/playwright.config.ts') != ''
        run: npm run test:browser -- --project=android --grep @smoke --grep-invert "@screens|@quarantine"
      # The area tests the plan job picked. Every-test pushes (mode all) run in the all-browser-tests job instead.
      - name: Browser tests for the changed areas
        id: areas
        if: hashFiles('tests/playwright.config.ts') != '' && needs.plan.outputs.mode == 'areas' && (success() || steps.smoke.outcome == 'failure')
        env:
          SPECS: ${{ needs.plan.outputs.specs }}
        run: |
          # A push that changes only screenshot tests (@screens) leaves no area test to run here: that is a pass.
          # shellcheck disable=SC2086
          npm run test:browser -- --project=android --grep-invert "@screens|@quarantine" --pass-with-no-tests $SPECS
      - name: Keep browser results
        if: failure() && (steps.smoke.outcome == 'failure' || steps.areas.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-quick
          path: test-results/browser/
          retention-days: 14
          if-no-files-found: ignore
      # Known-flaky tests (tagged @quarantine, tests/browser/README.md "Quarantine") are left out of the blocking steps
      # above and run here every time, all of them, whatever the plan picked. Non-blocking: a failure here never turns
      # the run red or holds back the preview; the results are listed on the run's summary page for the tester.
      # Runs after "Keep browser results", because each browser run empties test-results/browser/.
      - name: Quarantined browser tests (non-blocking)
        id: quarantine
        if: >-
          !cancelled() && hashFiles('tests/playwright.config.ts') != '' &&
          (steps.smoke.outcome == 'success' || steps.smoke.outcome == 'failure')
        continue-on-error: true
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ${{ github.workspace }}/test-results/quarantine-android.json
        run: |
          set +e
          npm run test:browser -- --project=android --grep @quarantine --grep-invert @screens --pass-with-no-tests --reporter=line,json
          status=$?
          node .github/scripts/quarantine-summary.mjs test-results/quarantine-android.json "Quarantined browser tests (Android)"
          exit $status
      - name: Keep quarantined browser results
        if: ${{ !cancelled() && steps.quarantine.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-quick-quarantine
          path: test-results/browser/
          retention-days: 14
          if-no-files-found: ignore

  # Every browser test on Android, split into two parallel halves; runs only when the plan says "all".
  all-browser-tests:
    needs: plan
    if: needs.plan.outputs.mode == 'all'
    name: Every browser test (${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-chromium-${{ steps.pw.outputs.version }}
      - name: Install browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install browser system libraries
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - name: Browser tests, shard ${{ matrix.shard }} of 2
        # Quarantined tests run in the verify job's non-blocking step instead.
        run: npm run test:browser -- --project=android --grep-invert "@screens|@quarantine" --pass-with-no-tests --shard=${{ matrix.shard }}/2
      - name: Keep browser results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-quick-shard-${{ matrix.shard }}
          path: test-results/browser/
          retention-days: 14
          if-no-files-found: ignore

  # Both halves build alongside the checks, so publishing adds little time. main only: lanes never publish.
  preview-site:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-site.yml
    permissions:
      contents: read
      actions: read
    with:
      site: preview
      sha: ${{ github.sha }}

  families-site:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-site.yml
    permissions:
      contents: read
      actions: read
    with:
      site: families

  # Publishes only when every quick job passed; the shards count as passed when they were not needed.
  publish:
    needs: [verify, all-browser-tests, preview-site, families-site]
    if: >-
      github.ref == 'refs/heads/main' &&
      !cancelled() &&
      needs.verify.result == 'success' &&
      (needs.all-browser-tests.result == 'success' || needs.all-browser-tests.result == 'skipped') &&
      needs.preview-site.result == 'success' &&
      needs.families-site.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}preview/
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-families
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: site/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
