# Complete run (docs/change-sop.md): every rule test and every browser test on both phones.
# Runs nightly (report only, publishes nothing) and when a release is called by hand:
#   gh workflow run ci.yml --ref main
# A release that is all green publishes the families' link, https://virapandy.github.io/pocket-game-night/,
# together with the newest preview (both halves always go up together; see build-site.yml).
# Everyday pushes run "Quick verify" (quick.yml) instead. The file keeps its name, ci.yml, so the
# families' half can find the last commit the old automation published until the first release here.
# The browser tests run in four parallel jobs (android and iphone, each split in two halves) to keep a round short.
name: Complete run

on:
  schedule:
    - cron: '0 3 * * *' # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A nightly run never cancels a release, and a release never cancels another: they queue.
concurrency:
  group: complete-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Boundary check
        run: npm run check:boundaries
      - name: Build
        run: npm run build
      # Test configs are written by the Test workspace; each layer runs once its config exists.
      - name: Rule, contract and property tests
        if: hashFiles('tests/vitest.config.ts') != ''
        run: npm test

  browser:
    name: browser (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [android, iphone]
        shard: [1, 2]
        include:
          - project: android
            browser: chromium
          - project: iphone
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # Browsers are cached per browser and per Playwright version (read from package-lock.json).
      - name: Playwright version
        id: pw
        if: hashFiles('tests/playwright.config.ts') != ''
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: pw-cache
        if: hashFiles('tests/playwright.config.ts') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      - name: Install browser
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system libraries
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Browser tests
        id: browser
        if: hashFiles('tests/playwright.config.ts') != ''
        run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2
      # When the browser step fails, keep its traces and screenshots so the Test workspace can see why.
      - name: Keep browser results
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/browser/
          retention-days: 14
          if-no-files-found: ignore

  # Release only: build both halves (the families' half from this commit) and publish them together.
  families-site:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-site.yml
    permissions:
      contents: read
      actions: read
    with:
      site: families
      sha: ${{ github.sha }}

  preview-site:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/build-site.yml
    permissions:
      contents: read
      actions: read
    with:
      site: preview
      fallback_sha: ${{ github.sha }}

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [check, browser, families-site, preview-site]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages-publish
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-families
          path: site
      - uses: actions/download-artifact@v4
        with:
          name: site-preview
          path: site/preview
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
