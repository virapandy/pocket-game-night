# Complete run (docs/change-sop.md): every rule test and every browser test on both phones.
# Report only: it never publishes anything. It runs nightly on main, and once on each release candidate
# (a tag on main), started by hand:
#   gh workflow run ci.yml --ref rc-2026-10-03
# After the owner tries the candidate and says yes, "Publish release" (release.yml) puts it on the
# families' link; it refuses a tag whose commit has no successful Complete run.
# Everyday pushes run "Quick verify" (quick.yml) instead.
# The browser tests run in four parallel jobs (android and iphone, each split in two halves) to keep a round short.
name: Complete run

on:
  schedule:
    - cron: '0 3 * * *' # nightly 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# A nightly run never cancels a candidate's run, and candidate runs never cancel each other: they queue.
concurrency:
  group: complete-run-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Boundary check
        run: npm run check:boundaries
      - name: Build
        run: npm run build
      # Test configs are written by the Test workspace; each layer runs once its config exists.
      - name: Rule, contract and property tests
        if: hashFiles('tests/vitest.config.ts') != ''
        # Release 1.2 branch only (docs/decisions.md 2026-10-03, "Release 1.2.0 only", Owner explicit):
        # Impostor is not in this release, so its rule and contract tests are left out. Not for main.
        run: npm test -- --exclude 'tests/games/impostor/**' --exclude 'tests/contract/impostor.test.ts'

  browser:
    name: browser (${{ matrix.project }} ${{ matrix.shard }}/2)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [android, iphone]
        shard: [1, 2]
        include:
          - project: android
            browser: chromium
          - project: iphone
            browser: webkit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      # Browsers are cached per browser and per Playwright version (read from package-lock.json).
      - name: Playwright version
        id: pw
        if: hashFiles('tests/playwright.config.ts') != ''
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: pw-cache
        if: hashFiles('tests/playwright.config.ts') != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ matrix.browser }}-${{ steps.pw.outputs.version }}
      - name: Install browser
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system libraries
        if: hashFiles('tests/playwright.config.ts') != '' && steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}
      - name: Browser tests
        id: browser
        if: hashFiles('tests/playwright.config.ts') != ''
        # Release 1.2 branch only (docs/decisions.md 2026-10-03, "Release 1.2.0 only", Owner explicit):
        # leaves out Impostor's browser tests and the @screens screenshot comparison. Not for main.
        run: npm run test:browser -- --project=${{ matrix.project }} --shard=${{ matrix.shard }}/2 --grep-invert '@screens|IMP-|impostor-[a-z-]+\.spec\.ts'
      # When the browser step fails, keep its traces and screenshots so the Test workspace can see why.
      - name: Keep browser results
        if: failure() && steps.browser.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/browser/
          retention-days: 14
          if-no-files-found: ignore
