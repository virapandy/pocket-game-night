# Once a week (and on request): the long, report-only checks (PLT-118).
# Mass simulation with an optional Jev smoke run, mutation testing, the Android phone emulator, and screen
# simulation evenings (200 by default; on request use the inputs below, `only_sims` to run them alone).
# Separate from "Complete run" (ci.yml): it never blocks, cancels or waits on it, and never publishes.
# Every job is report-only: a failure here shows in the results but fails nothing else.
name: Weekly extended checks

on:
  schedule:
    - cron: '0 2 * * 1' # Mondays 02:00 UTC
  workflow_dispatch:
    inputs:
      evenings:
        description: 'Screen simulation evenings (screen-sims job)'
        type: number
        default: 200
      jev_evenings:
        description: 'How many of those evenings Jev plays as a persona'
        type: number
        default: 50
      only_sims:
        description: 'Run only the screen simulations (skip the mass simulation, mutation and Android jobs)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: weekly-extended-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulation:
    if: ${{ !inputs.only_sims }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: ISO week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # This week's Jev decision count is kept between runs, so repeated manual runs stay under the weekly cap.
      # Each run saves a new copy (a cache key cannot be overwritten); the newest one for the week is restored.
      - uses: actions/cache@v4
        with:
          path: reports/runs/jev-usage.json
          key: jev-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}
          restore-keys: |
            jev-usage-${{ steps.week.outputs.week }}-
            jev-usage-
      - name: Mass simulation and Jev smoke run
        run: npm run test:extended
        env:
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation
          path: |
            reports/sim/
            tests/replays/
          if-no-files-found: warn

  # Mutation testing is split into four groups of files that run side by side, so each finishes well inside its
  # limit (one job for every file ran past 300 minutes). Together the groups cover exactly the files listed under
  # `mutate` in tests/stryker.config.mjs (the command line's --mutate replaces that list for one group). If that
  # list changes, change the groups here to match.
  mutation:
    if: ${{ !inputs.only_sims }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: tambola-rules
            files: src/games/tambola/rules/rules.ts
          - group: tambola-prizes-check
            files: src/games/tambola/rules/prizes.ts,src/games/tambola/rules/check.ts
          - group: tambola-codes-tickets
            files: src/games/tambola/rules/codes.ts,src/games/tambola/rules/tickets.ts:1-91,src/games/tambola/rules/tickets.ts:94-120,src/games/tambola/rules/tickets.ts:122-9999
          - group: engine-money-tally
            files: src/engine/money.ts,src/engine/tally.ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # GitHub's standard runners have 4 processor cores; the config's 2 suits a laptop.
      - name: Mutation testing (${{ matrix.group }})
        run: npm run test:mutation -- --mutate "${{ matrix.files }}" --concurrency 4
      - name: Mutation summary (${{ matrix.group }})
        if: always()
        run: npm run test:mutation:summary
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-${{ matrix.group }}
          path: |
            reports/mutation-latest.md
            reports/stryker/
          if-no-files-found: warn

  android:
    if: ${{ !inputs.only_sims }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Enable hardware acceleration for the emulator (KVM)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Android emulator tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: npm run test:android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android
          path: test-results/android/
          if-no-files-found: warn

  # Collects the jobs' results and summaries into one artifact and the run's summary page.
  # It does not commit: the Test role copies what it needs into reports/.
  report:
    needs: [simulation, mutation, android]
    if: ${{ always() && !inputs.only_sims }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write the weekly report
        env:
          SIMULATION: ${{ needs.simulation.outcome }}
          MUTATION: ${{ needs.mutation.outcome }}
          ANDROID: ${{ needs.android.outcome }}
        run: |
          day=$(date -u +%Y-%m-%d)
          mkdir -p weekly
          out="weekly/$day.md"
          {
            echo "# Weekly run $day"
            echo
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Mass simulation and Jev smoke run | $SIMULATION |"
            echo "| Mutation testing (four groups; shows failure if any group failed) | $MUTATION |"
            echo "| Android emulator | $ANDROID |"
            echo
            echo "## Simulation summary"
            cat artifacts/simulation/reports/sim/summary-latest.md 2>/dev/null || echo "No simulation summary."
            echo
            echo "## Mutation summary"
            echo
            echo "Mutation testing runs as four groups of files at once. Each group's score is below; the overall line adds up the groups that finished."
            echo
            node -e '
              const fs = require("fs");
              let c = 0, m = 0, groups = 0;
              for (const d of fs.readdirSync("artifacts").filter((d) => d.startsWith("mutation-")).sort()) {
                for (const f of [`artifacts/${d}/stryker/mutation.json`, `artifacts/${d}/reports/stryker/mutation.json`]) {
                  if (!fs.existsSync(f)) continue;
                  groups++;
                  for (const { mutants } of Object.values(JSON.parse(fs.readFileSync(f, "utf8")).files))
                    for (const mu of mutants) {
                      if (["Killed", "Timeout"].includes(mu.status)) c++;
                      else if (["Survived", "NoCoverage"].includes(mu.status)) m++;
                    }
                  break;
                }
              }
              const s = c + m ? (100 * c) / (c + m) : 100;
              console.log(groups
                ? `Overall (${groups} of 4 groups finished): **${s.toFixed(1)}%** of deliberate mistakes caught (${c} of ${c + m}); target 80%.`
                : "No group finished, so there is no overall score.");
            ' 2>/dev/null || echo "The overall score could not be worked out."
            echo
            for g in tambola-rules tambola-prizes-check tambola-codes-tickets engine-money-tally; do
              echo "### Group: $g"
              echo
              cat "artifacts/mutation-$g/mutation-latest.md" 2>/dev/null || cat "artifacts/mutation-$g/reports/mutation-latest.md" 2>/dev/null || echo "No summary for this group: it did not finish."
              echo
            done
          } > "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: weekly/

  # Screen simulation evenings (report-only): whole evenings played through the app's screens, split over 8
  # machines. About 2 minutes an evening; 25 per shard at 2 workers is about 30 minutes. Jev plays some evenings
  # as a persona, inside the weekly decision cap (the same jev-usage count as the simulation job).
  # It waits for the simulation job (when that runs), so it starts from the Jev count that job saved; with
  # only_sims the simulation job is skipped and this still runs.
  screen-sims:
    needs: simulation
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: ISO week
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      # This week's Jev decision count (PLT-113): the shards only read it, so each worker stops calling Jev once the
      # count is at the weekly cap. They never save it; screen-sims-report adds the whole run's use and saves once.
      - uses: actions/cache/restore@v4
        with:
          path: reports/runs/jev-usage.json
          key: jev-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}-sims
          restore-keys: |
            jev-usage-${{ steps.week.outputs.week }}-
            jev-usage-
      # A manual 0 means 0 (format() turns "not given" into '' but 0 into '0').
      - name: Screen simulation evenings (shard ${{ matrix.shard }} of 8)
        run: npx playwright test --config tests/playwright.sims.config.ts --shard=${{ matrix.shard }}/8 --workers=2
        env:
          SIM_EVENINGS: ${{ format('{0}', inputs.evenings) == '' && 200 || inputs.evenings }}
          SIM_JEV_EVENINGS: ${{ format('{0}', inputs.jev_evenings) == '' && 50 || inputs.jev_evenings }}
          SIM_RUN: w${{ github.run_id }}
          JEV_DECISIONS: 400
          JEV_API_KEY: ${{ secrets.JEV_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-sims-${{ matrix.shard }}
          path: |
            reports/sim/screen/
            tests/replays/screen/
          if-no-files-found: warn

  screen-sims-report:
    needs: screen-sims
    if: always()
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          pattern: screen-sims-*
          merge-multiple: true
          path: sims/
      - name: Screen simulation summary
        run: |
          node tests/sims/summary.mjs sims/reports/sim/screen
          cat reports/sim/screen-summary.md >> "$GITHUB_STEP_SUMMARY"
      # PLT-113: record the whole run's Jev use once. Restore the newest count (the one the shards started from),
      # add every evening's jevDecisions from the result files, and save it as a new copy for the week.
      - name: ISO week
        id: week
        if: always()
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v4
        if: always()
        with:
          path: reports/runs/jev-usage.json
          key: jev-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}-sims
          restore-keys: |
            jev-usage-${{ steps.week.outputs.week }}-
            jev-usage-
      - name: Add this run's Jev decisions to the weekly count
        if: always()
        env:
          WEEK: ${{ steps.week.outputs.week }}
        run: |
          node -e '
            const fs = require("fs");
            const dir = "sims/reports/sim/screen", file = "reports/runs/jev-usage.json", week = process.env.WEEK;
            let used = 0;
            if (fs.existsSync(dir))
              for (const f of fs.readdirSync(dir, { recursive: true }).filter((f) => String(f).endsWith(".json"))) {
                try { used += Number(JSON.parse(fs.readFileSync(`${dir}/${f}`, "utf8")).jevDecisions) || 0; } catch {}
              }
            let all = {};
            try { all = JSON.parse(fs.readFileSync(file, "utf8")); } catch {}
            const before = Number(all[week]) || 0;
            all[week] = before + used;
            fs.mkdirSync("reports/runs", { recursive: true });
            fs.writeFileSync(file, JSON.stringify(all, null, 1));
            console.log(`Jev decisions this week: ${before} before this run + ${used} in it = ${all[week]} of 20,000.`);
          '
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: reports/runs/jev-usage.json
          key: jev-usage-${{ steps.week.outputs.week }}-${{ github.run_id }}-sims
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screen-sims-report
          path: |
            reports/sim/screen-summary.md
            sims/tests/replays/screen/
          if-no-files-found: warn
