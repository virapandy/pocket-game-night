# Builds one half of the published site, for "Quick verify" (quick.yml) and "Publish release" (release.yml).
# GitHub Pages holds one site, so every publish uploads both halves together:
#   families: the last released commit, at https://virapandy.github.io/pocket-game-night/
#   preview:  the newest checked commit, at https://virapandy.github.io/pocket-game-night/preview/
# Each half is rebuilt from its commit, so nothing has to be stored between runs.
# When no commit is given, the right one is looked up from earlier successful runs:
#   families: the tag named by the newest successful "Publish release" run (release.yml; its run name is
#             "Publish release <tag>"). Before the first such release, the commit the old automation last
#             published: the newest successful ci.yml run on main started by push or by hand before
#             3 October 2026 07:30 UTC (after that, ci.yml publishes nothing).
#   preview:  the newest successful "Quick verify" push run.
name: Build site half

on:
  workflow_call:
    inputs:
      site:
        description: families or preview
        required: true
        type: string
      sha:
        description: commit to build; empty means look it up
        required: false
        type: string
        default: ''
      fallback_sha:
        description: commit to use when the lookup finds nothing; empty means fail
        required: false
        type: string
        default: ''

jobs:
  build:
    name: build ${{ inputs.site }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Choose commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SITE: ${{ inputs.site }}
          SHA: ${{ inputs.sha }}
          FALLBACK: ${{ inputs.fallback_sha }}
        run: |
          # try CMD... up to 3 times, 2 s then 4 s apart. It retries on an error (stderr is shown, never hidden)
          # and on an empty answer (GitHub's run list has returned an empty list for a moment while runs exist).
          try() {
            local n out
            for n in 1 2 3; do
              if out=$("$@") && [ -n "$out" ]; then printf '%s' "$out"; return 0; fi
              echo "Lookup attempt $n of 3 gave no answer: $*" >&2
              [ "$n" -lt 3 ] && sleep $((n * 2))
            done
            return 0
          }
          LOOKUP="given commit"
          if [ -z "$SHA" ]; then
            if [ "$SITE" = families ]; then
              LOOKUP="newest successful release.yml run (tag from its title)"
              TITLE=$(try gh run list -R "$REPO" --workflow release.yml --status success --limit 1 \
                --json displayTitle -q '.[0].displayTitle // empty')
              TAG=$(printf '%s\n' "$TITLE" | sed -n 's/^Publish release //p')
              if [ -n "$TAG" ]; then
                SHA=$(try gh api "repos/$REPO/commits/$TAG" --jq .sha)
                echo "Last release: $TAG"
              else
                # Never fall back to the old ci.yml commit once any release exists: that would silently publish an older site.
                if [ -n "$(gh release list -R "$REPO" --limit 1 --json tagName -q '.[0].tagName // empty')" ]; then
                  echo "::group::Diagnostics"
                  echo "A release exists but the release.yml lookup stayed empty after 3 tries (title found: '${TITLE:-none}')."
                  gh release list -R "$REPO" --limit 3 || true
                  gh run list -R "$REPO" --workflow release.yml --limit 5 --json displayTitle,status,conclusion,createdAt || true
                  echo "::endgroup::"
                  echo "::error::Cannot find the last released commit for the families site although a release exists. Refusing to fall back to an older commit; nothing published. Try again in a minute."
                  exit 1
                fi
                LOOKUP="no release has ever existed; newest successful ci.yml push/manual run on main before 2026-10-03T07:30Z"
                SHA=$(try gh run list -R "$REPO" --workflow ci.yml --branch main --status success --limit 100 \
                  --json headSha,event,createdAt -q '[.[] | select((.event == "workflow_dispatch" or .event == "push") and .createdAt < "2026-10-03T07:30:00Z")][0].headSha // empty')
              fi
            else
              LOOKUP="newest successful quick.yml push run on main"
              SHA=$(try gh run list -R "$REPO" --workflow quick.yml --branch main --event push --status success --limit 1 \
                --json headSha -q '.[0].headSha // empty')
            fi
          fi
          [ -z "$SHA" ] && SHA="$FALLBACK"
          if [ -z "$SHA" ]; then
            echo "Lookup for the $SITE site: $LOOKUP"
            echo "Release title found: '${TITLE:-none}'; release tag found: '${TAG:-none}'; commit found: '(empty)'; fallback_sha: '${FALLBACK:-none}'."
            echo "Recent successful release.yml runs:"; gh run list -R "$REPO" --workflow release.yml --status success --limit 3 --json displayTitle,headSha,createdAt || true
            echo "::error::No commit found for the $SITE site (lookup: $LOOKUP; tag: '${TAG:-none}'); nothing published."
            exit 1
          fi
          echo "Building the $SITE site from $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.pick.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        env:
          SITE: ${{ inputs.site }}
          SHA: ${{ steps.pick.outputs.sha }}
        run: |
          # The families' site is the release build: it ignores Impostor's test seeds (IMP-064, Test hooks item 3).
          if [ "$SITE" = preview ]; then
            export APP_BASE=/pocket-game-night/preview/
            GITHUB_SHA="$SHA" npm run build
          else
            GITHUB_SHA="$SHA" npm run build -- --mode release
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: site-${{ inputs.site }}
          path: dist
          retention-days: 1
          if-no-files-found: error
